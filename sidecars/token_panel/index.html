<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Tracker</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css?v=14">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1>Token Tracker</h1>
        </div>
        <div class="header-actions">
          <button id="lang-btn" class="icon-btn lang-btn" type="button" title="Switch language">EN</button>
          <div class="export-wrap">
            <button id="export-btn" class="icon-btn" type="button" aria-expanded="false" aria-label="Export">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <div id="export-menu" class="export-menu" hidden>
              <button type="button" class="menu-item" data-export="csv" data-i18n="exportCsv">导出 CSV</button>
              <button type="button" class="menu-item" data-export="md" data-i18n="exportMd">导出 Markdown</button>
              <button type="button" class="menu-item" data-export="copy" data-i18n="copyMd">复制 Markdown</button>
            </div>
          </div>
          <button id="settings-btn" class="icon-btn" type="button" aria-expanded="false" aria-label="Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
      </div>

      <div id="settings-panel" class="settings-panel" hidden>
        <div class="settings-title">
          <span data-i18n="settingsTitle">Hook、预算与计价配置</span>
          <span id="settings-status" class="muted"></span>
        </div>
        <label class="toggle-row">
          <span data-i18n="optSessionTotal">Hook 显示本会话累计</span>
          <input type="checkbox" id="opt-session-total">
        </label>
        <label class="toggle-row">
          <span data-i18n="optHookCost">Hook 摘要显示估算费用 ($)</span>
          <input type="checkbox" id="opt-hook-cost">
        </label>
        <label class="toggle-row">
          <span data-i18n="optPromoPricing">促销期内按官方促销价计费</span>
          <input type="checkbox" id="opt-promo-pricing">
        </label>
        <div class="budget-form-row">
          <label class="budget-field">
            <span data-i18n="budgetDailyLabel">日预算 (USD, 0=关)</span>
            <input type="number" id="opt-budget-daily" class="pricing-input" min="0" step="1" placeholder="0">
          </label>
          <label class="budget-field">
            <span data-i18n="budgetWeeklyLabel">周预算 (USD, 0=关)</span>
            <input type="number" id="opt-budget-weekly" class="pricing-input" min="0" step="5" placeholder="0">
          </label>
        </div>
        <details id="pricing-details" class="pricing-details">
          <summary data-i18n="customPricingSummary">自定义模型单价 (USD / 1M tokens)</summary>
          <div class="pricing-hint muted" data-i18n="customPricingHint">修改 Input / Output / Cache Read 单价；日志中出现的新模型也会自动列在下方。</div>
          <div id="pricing-table" class="pricing-table"></div>
          <div class="pricing-actions">
            <button id="reset-pricing-btn" class="secondary-btn" type="button" data-i18n="resetPricing">恢复官方默认</button>
            <button id="save-pricing-btn" class="save-btn" type="button" data-i18n="savePricing">保存单价</button>
          </div>
        </details>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="current" role="tab" aria-selected="true" data-i18n="tabCurrent">当前任务</button>
        <button class="tab" data-tab="history" role="tab" aria-selected="false" data-i18n="tabHistory">全部任务</button>
      </div>
    </header>

    <main class="main">
      <section id="view-current" class="view active">
        <div id="current-header" class="conv-banner"></div>
        <div id="current-cards" class="stat-grid"></div>
        <div id="current-models" class="chart-card" hidden></div>
        <div id="context-chart" class="chart-card" hidden></div>
        <div class="section-title">
          <span data-i18n="turnsTitle">轮次明细 (Turns)</span>
          <span id="turn-count" class="muted"></span>
        </div>
        <div id="turns-list" class="list"></div>
      </section>

      <section id="view-history" class="view">
        <div class="range-row">
          <div class="seg range-seg" id="range-bar" role="group">
            <button type="button" class="seg-btn" data-range="today" data-i18n="rangeToday">今日</button>
            <button type="button" class="seg-btn" data-range="7d" data-i18n="range7d">7天</button>
            <button type="button" class="seg-btn" data-range="30d" data-i18n="range30d">30天</button>
            <button type="button" class="seg-btn active" data-range="all" data-i18n="rangeAll">全部</button>
          </div>
          <span id="range-summary" class="muted range-summary"></span>
        </div>
        <div id="budget-bar" class="budget-bar" hidden></div>
        <div id="global-cards" class="stat-grid"></div>
        <div id="trend-chart" class="chart-card"></div>
        <div id="global-models" class="chart-card" hidden></div>
        <div class="toolbar">
          <input id="search-input" class="search" type="search" placeholder="搜索任务提示词、模型或 ID…">
          <select id="sort-select" class="select">
            <option value="recent" data-i18n="sortRecent">最近更新</option>
            <option value="cost" data-i18n="sortCost">花费最高</option>
            <option value="total" data-i18n="sortTotal">总 Token 最多</option>
            <option value="billed" data-i18n="sortBilled">非缓存最多</option>
          </select>
        </div>
        <div id="history-list" class="list"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js?v=16"></script>
</body>
</html>
